<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="nav-left">
                <h3>INSECT</h2>
                <img src="./assests/search.png" alt="Search""> 
                <input type="text" placeholder="search">
                
            </div>
            <div>
                <h2 style="font-weight:lighter;">Classification</h2>
 

                <div class="left-data">
                    <div class="specie-info">
                        <div class="dot"></div>
                    <div>
                        <p><span style="font-weight: bold; line-height: 2;">Class:</span> <br>Insecta</p>
                    </div>
                    </div>

                    <div class="specie-info">
                        
                        <div class="dot"></div>
                    <div>
                        <p><span style="font-weight: bold; line-height: 2;">Order:</span> <br>Coleptera</p>
                    </div>
                    </div>

                    <div class="specie-info">
                        <div class="dot"></div>
                    <div>
                        <p><span style="font-weight: bold; line-height: 2;">Family:</span> <br>Cerambycidae</p>
                    </div>
                    </div>


                    <div class="specie-info">
                        <div class="dot"></div>
                    <div>
                        <p><span style="font-weight: bold; line-height: 2;">Sub-Family:</span> <br>Callichoridae</p>
                    </div>
                    </div>


                    <div class="specie-info">
                        <div class="dot"></div>
                    <div>
                        <p><span style="font-weight: bold; line-height: 2;">Genus:</span> <br>Pachyteria</p>
                    </div>
                    </div>
            
                </div>
                    


            </div>


            <img src="./assests/insect.webp" alt="">
        </div>
        <div class="right">
            <navbar class="navbar">
                <ul>
                    <li>Home</li>
                    <li>Shop</li>
                    <li>About</li>
                    <li>Gallery</li>
                    <li>Contact</li>
                </ul>
            </nav>

<div class="right-wrap">
                <div class="right-mid">
                <h1>Pachyteria <br>
                equestris</h1>
            </div>

            <div class="mid-info">
                <img src="./assests/small-insect.webp" alt="" class="insect-img">
                <hr class="hr">
                <div class="insect-info">
                    <div class="box-info">
                    <img src="./assests/map-pin-fill.png" alt="" class="small-img">
                    <div>
                        <p>Locality: <br>Malaysia</p>
                    </div>
                    </div>

                    <div class="box-info">
                    <img src="./assests/Man Symbol.png" alt="" class="small-img">
                    <div>
                        <p>Sex: <br>Male</p>
                    </div>
                    </div>

                    <div class="box-info">
                    <img src="./assests/ruler-line.png" alt=""" class="small-img">
                    <div>
                        <p>Size: <br>32mm/12mm</p>
                    </div>
                    </div>
            
                </div>
            </div>

            <div class="bottom-section">

    <h1 class="price">$5.99</h1>

    <div class="toggle-box">
        <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label>

        <p>View detailed antennae</p>
    </div>

    <div class="toggle-box">
        <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label>

        <p>View underside</p>
    </div>

    <button class="collection-btn">
        Add to collection
    </button>

</div>
</div>
        </div>
    </div>
</body>
</html>
